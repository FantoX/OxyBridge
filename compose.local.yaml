# Optional local PostgreSQL. Application secrets still come from .env.
x-local-environment: &local-environment
  APP_ENV: development
  APP_BASE_URL: http://localhost:${APP_PORT:-8000}
  SESSION_COOKIE_SECURE: "false"
  CORS_ALLOWED_ORIGINS: '["http://localhost:${APP_PORT:-8000}","http://127.0.0.1:${APP_PORT:-8000}"]'
  DATABASE_URL: postgresql+psycopg://oxybridge:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}@postgres:5432/oxybridge

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: oxybridge
      POSTGRES_USER: oxybridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U oxybridge -d oxybridge"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    environment: *local-environment
    depends_on:
      postgres:
        condition: service_healthy

  app:
    environment:
      <<: *local-environment
      PORT: "8000"

  dispatcher:
    environment: *local-environment

  scheduler:
    environment: *local-environment

volumes:
  postgres-data:
