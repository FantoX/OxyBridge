[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oxybridge"
version = "0.1.2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Self-hosted, durable workflow automation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "sqlalchemy==2.1.4", "psycopg[binary]==3.3.6", "alembic==1.20.0",
  "pydantic-settings==2.15.0", "argon2-cffi==25.1.0", "cryptography==50.0.2", "httpx==0.28.1",
  "jsonschema==4.26.0", "croniter==6.2.4", "regex==2026.9.29", "prometheus-client==0.26.0", "email-validator==2.3.0",
  "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
dev = ["pip==26.2.1", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.0", "pip-audit==2.10.1", "pyyaml==6.0.3"]

[tool.setuptools.packages.find]
include = ["oxybridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Test configuration must be applied before importing the application.
"tests/conftest.py" = ["E402"]

[tool.uv]
constraint-dependencies = [
  "alembic==1.20.0",
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
