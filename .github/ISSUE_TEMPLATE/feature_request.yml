name: Feature request
description: Propose an improvement with a concrete use case.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the work you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected outcome and any alternatives you considered.
    validations:
      required: true
